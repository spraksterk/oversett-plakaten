<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Oversett plakaten</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: white;
      color: #111;
    }

    main {
      max-width: 500px;
      margin: auto;
    }

    .icon {
      font-size: 56px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    a {
      display: block;
      padding: 18px;
      margin: 16px 0;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .primary {
      background: #111;
      color: white;
    }

    .secondary {
      border: 2px solid #111;
      color: #111;
    }

    .hint {
      font-size: 16px;
      color: #555;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<main>

  <div class="icon">🌍📱</div>

  <h1>Translate this poster</h1>

  <p>
    Use your camera to read the poster in your language.
  </p>

  <a class="primary" href="googletranslate:///open/camera">
    📷 Open camera translation
  </a>

  <a class="secondary" href="https://translate.google.com/">
    🌐 Open Google Translate
  </a>

  <p class="hint">
    Point your camera at the poster.
  </p>

</main>

</body>
</html>
