<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oversett plakaten</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: white;
      color: #111;
    }

    main {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      font-size: 28px;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    a {
      display: block;
      padding: 16px;
      margin: 16px 0;
      border-radius: 10px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .primary {
      background: #111;
      color: white;
    }

    .secondary {
      border: 2px solid #111;
      color: #111;
    }
  </style>
</head>

<body>

<main>

  <h1>Les plakaten på ditt språk</h1>

  <p>
    Trykk på knappen under for å åpne kameraoversettelse i Google Translate.
  </p>

  <a class="primary"
     href="googletranslate:///open/camera">
    Åpne kameraoversettelse
  </a>

  <a class="secondary"
     href="https://translate.google.com/">
    Åpne Google Translate på nett
  </a>

  <p>
    Hvis Google Translate-appen ikke er installert,
    bruk nettversjonen eller installer appen først.
  </p>

</main>

</body>
</html>
