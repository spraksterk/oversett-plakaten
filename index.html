<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Translate this poster</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: white;
      color: #111;
      margin: 0;
      padding: 32px 20px;
      text-align: center;
    }

    main {
      max-width: 500px;
      margin: 0 auto;
    }

    .hero {
      font-size: 60px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .intro {
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .button {
      display: block;
      padding: 18px;
      margin: 14px 0;
      border-radius: 14px;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
    }

    .primary {
      background: #111;
      color: white;
    }

    .secondary {
      border: 2px solid #111;
      color: #111;
      background: white;
    }

    .steps {
      margin-top: 32px;
      font-size: 17px;
      line-height: 1.8;
    }

    .small {
      margin-top: 28px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

<main>

  <div class="hero">🌍 📱 📷</div>

  <h1>Translate this poster</h1>

  <p class="intro">
    Use your phone camera to read this poster in your language.
  </p>

  <a
    class="button primary"
    href="googletranslate:///open/camera">
    📷 Open camera translation
  </a>

  <a
    id="installButton"
    class="button secondary"
    href="#">
    ⬇️ Get Google Translate
  </a>

  <div class="steps">
    <div>1. 📷 Open camera</div>
    <div>2. 🪧 Point at the poster</div>
    <div>3. 🌍 Read in your language</div>
  </div>

  <p class="small">
    Google Translate app required for camera translation.
  </p>

</main>

<script>
  const installButton = document.getElementById("installButton");

  const isAndroid = /Android/i.test(navigator.userAgent);
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (isAndroid) {
    installButton.href =
      "https://play.google.com/store/apps/details?id=com.google.android.apps.translate";
  } else if (isIOS) {
    installButton.href =
      "https://apps.apple.com/app/google-translate/id414706506";
  } else {
    installButton.href =
      "https://translate.google.com/about/";
  }
</script>

</body>
</html>
